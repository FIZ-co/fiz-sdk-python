name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Generated code matches openapi/openapi.json
        run: uv run python scripts/generate.py && git diff --exit-code src/fiz_sdk/generated
      - name: Check (lint, format, types, README, tests, build)
        run: ./scripts/check.sh
