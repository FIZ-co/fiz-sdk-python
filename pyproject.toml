[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "fiz-sdk"
dynamic = ["version"]
description = "Official Python SDK for the FIZ API: issue AT-certified invoices in Portugal (faturação certificada, ATCUD, QR code, SAF-T) from your code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FIZ" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  # TypedDict with ReadOnly, NotRequired and Unpack as Python 3.13 ships them.
  "typing-extensions>=4.9; python_version < '3.13'",
]
keywords = [
  "fiz",
  "invoicing",
  "invoice",
  "portugal",
  "faturação",
  "faturacao certificada",
  "fatura",
  "AT",
  "autoridade tributária",
  "ATCUD",
  "SAF-T",
  "e-fatura",
  "IVA",
  "VAT",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://api.fiz.co"
Documentation = "https://api.fiz.co/docs/quickstart"
Repository = "https://github.com/FIZ-co/fiz-sdk-python"
Issues = "https://github.com/FIZ-co/fiz-sdk-python/issues"
Changelog = "https://github.com/FIZ-co/fiz-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.hatch.version]
path = "src/fiz_sdk/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fiz_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/fiz_sdk", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/readme"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Typographic characters (…, —, →) are wanted in messages and docs.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples", "scripts"]
exclude = ["^tests/readme/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The sandbox suite calls the real API: `pytest -m sandbox` runs it.
addopts = ["--strict-markers", "-m", "not sandbox"]
markers = ["sandbox: end to end against the FIZ API sandbox (needs FIZ_TEST_API_KEY)"]
